# Asphalt 5 HD (com.gameloft.android.GAND.GloftA5HD) 3.4.1: libasphalt5.so, the
# 32-bit EABI4 Gameloft build (GLES 1.x). libigp.so (the ads menu) is not loaded.
MODULES libasphalt5.so
# ctype / wctype / libm whose bionic and newlib ABIs agree.
PASSTHROUGH isprint ldexpf
PASSTHROUGH __aeabi_uidiv __aeabi_uidivmod __aeabi_unwind_cpp_pr0 __aeabi_unwind_cpp_pr1
PASSTHROUGH iswalpha iswcntrl iswdigit iswlower iswprint iswpunct iswspace iswupper iswxdigit
